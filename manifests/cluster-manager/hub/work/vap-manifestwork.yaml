apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: manifestwork.admission.work.open-cluster-management.io
  labels:
    {{ if gt (len .Labels) 0 }}
    {{ range $key, $value := .Labels }}
    "{{ $key }}": "{{ $value }}"
    {{ end }}
    {{ end }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["work.open-cluster-management.io"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE"]
      resources: ["manifestworks"]

  variables:
  # Calculate total size of all manifests
  - name: totalSize
    expression: |
      object.spec.workload.manifests.map(m, size(string(m))).sum()

  # Extract manifest keys for duplicate detection
  - name: manifestKeys
    expression: |
      object.spec.workload.manifests.map(m,
        string(has(m.apiVersion) ? m.apiVersion : 'v1') + '/' +
        string(has(m.kind) ? m.kind : '') + '/' +
        string(has(m.metadata.namespace) ? m.metadata.namespace : '') + '/' +
        string(m.metadata.name)
      )

  # Check if executor has changed (for conditional RBAC check)
  - name: executorChanged
    expression: |
      !has(oldObject) || !has(oldObject.spec.executor) || !has(object.spec.executor) ||
      oldObject.spec.executor != object.spec.executor

  # Get the executor subject (use default if not specified)
  - name: executorSubject
    expression: |
      has(object.spec.executor) && has(object.spec.executor.subject) && has(object.spec.executor.subject.serviceAccount) ?
        object.spec.executor.subject.serviceAccount :
        {'namespace': '', 'name': 'klusterlet-work-sa'}

  validations:
  # 1. Manifests must not be empty
  - expression: "size(object.spec.workload.manifests) > 0"
    message: "manifests should not be empty"
    reason: Invalid

  # 2. Total size must not exceed 500KB (512000 bytes)
  - expression: "variables.totalSize <= 512000"
    message: "the size of manifests exceeds the 512000 byte limit"
    reason: Invalid
    messageExpression: |
      'the size of manifests is ' + string(variables.totalSize) + ' bytes which exceeds the 512000 limit'

  # 3. Each manifest must have metadata.name set
  - expression: |
      object.spec.workload.manifests.all(m,
        has(m.metadata) && has(m.metadata.name) && m.metadata.name != ''
      )
    message: "name must be set in manifest"
    reason: Invalid

  # 4. No manifest should have generateName set
  - expression: |
      object.spec.workload.manifests.all(m,
        !has(m.metadata) || !has(m.metadata.generateName) || m.metadata.generateName == ''
      )
    message: "generateName must not be set in manifest"
    reason: Invalid

  # 5. No duplicate manifests (check if unique keys match total count)
  - expression: "size(variables.manifestKeys) == size(variables.manifestKeys.unique())"
    message: "duplicate manifests detected"
    reason: Invalid

  # 6. RBAC check for executor permission (only when executor changes)
  # Check if user has execute-as permission for the executor service account
  # Note: This VAP always validates the executor (using default if not specified),
  # equivalent to NilExecutorValidating=true. This is more secure than the optional
  # validation in webhooks when NilExecutorValidating=false.
  - expression: |
      !variables.executorChanged ||
      authorizer.group('work.open-cluster-management.io').
        resource('manifestworks').
        subresource('execute-as').
        namespace(object.metadata.namespace).
        name('system:serviceaccount:' +
          string(variables.executorSubject.namespace) + ':' +
          string(variables.executorSubject.name)).
        check('create').allowed()
    message: "user does not have permission to manipulate ManifestWork with the specified executor"
    reason: Forbidden
    messageExpression: |
      'user cannot manipulate the ManifestWork with executor ' +
      string(variables.executorSubject.namespace) + '/' +
      string(variables.executorSubject.name) +
      ' in namespace ' + object.metadata.namespace
